name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - run: pnpm test:a11y
      - run: pnpm build
      - run: pnpm audit:governed:prod
      - run: pnpm audit:governed

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.9-alpine
        env:
          POSTGRES_DB: atlas
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ATLAS_ENVIRONMENT: test
      ATLAS_DATABASE_URL: postgresql+asyncpg://atlas:atlas-ci-only@localhost:5432/atlas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt
      - run: pip install -r apps/api/requirements-dev.txt
      - run: python -m ruff format --check apps packages/database
      - run: python -m ruff check apps packages/database
      - run: python -m mypy apps/api/src packages/database/atlas_database
      - run: python -m pip check
      - run: python -m pip_audit -r apps/api/requirements.txt
      - run: alembic -c packages/database/alembic.ini upgrade head
      - run: ATLAS_TEST_DATABASE_URL="$ATLAS_DATABASE_URL" pytest --cov=apps.api.src --cov=packages.database.atlas_database --cov-report=term-missing --cov-fail-under=80
      - run: alembic -c packages/database/alembic.ini downgrade 20260728_0006
      - run: alembic -c packages/database/alembic.ini upgrade head
      - run: alembic -c packages/database/alembic.ini check

  compose-configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
