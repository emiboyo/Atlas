name: ${COMPOSE_PROJECT_NAME:-atlas-ai}

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}/api/v1
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}/api/v1
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [frontend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      ATLAS_ENVIRONMENT: development
      ATLAS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:-atlas-local-only}@postgres:5432/${POSTGRES_DB:-atlas}
      ATLAS_REDIS_URL: redis://redis:6379/0
      ATLAS_CORS_ORIGINS: '["http://localhost:${WEB_PORT:-3000}"]'
      ATLAS_TRUSTED_HOSTS: '["localhost","127.0.0.1","api"]'
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [frontend, backend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atlas} -d ${POSTGRES_DB:-atlas}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [backend]
    security_opt: [no-new-privileges:true]

  redis:
    image: redis:7.4.5-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [backend]
    security_opt: [no-new-privileges:true]

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres_data:
  redis_data:
