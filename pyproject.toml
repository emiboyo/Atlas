[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["packages/database/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE", "UP", "ASYNC", "S", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["apps/api/tests", "packages/database/tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
exclude = ["packages/database/alembic"]

[[tool.mypy.overrides]]
module = ["prometheus_client.*", "redis.*", "structlog.*"]
ignore_missing_imports = true
